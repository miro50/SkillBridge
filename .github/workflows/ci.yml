name: SkillBridge CI & Quality Assurance Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qa-engineering-gate:
    name: Typecheck, Vitest Matrix & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Static Type Checking (TypeScript 0-Error Policy)
        run: npx tsc --noEmit

      - name: Unit & Integration Testing (Vitest 10 Suites)
        run: npm test

      - name: Next.js Production Build Validation
        env:
          NEXT_PUBLIC_APP_URL: 'https://skillbridge-mocha-three.vercel.app'
        run: npm run build
